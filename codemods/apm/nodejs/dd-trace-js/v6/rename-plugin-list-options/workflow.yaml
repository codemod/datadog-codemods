# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: '1'

nodes:
  - id: apply-transform
    name: Rename Datadog plugin list options
    type: automatic
    steps:
      - name: 'Rename whitelist/blacklist on target plugin configs'
        js-ast-grep:
          js_file: scripts/codemod.ts
          language: 'tsx'
          semantic_analysis: file
          base_path: '.'
          include:
            - '**/*.{js,jsx,ts,tsx,mjs,cjs}'
          exclude:
            - '**/node_modules/**'
            - '**/dist/**'
            - '**/build/**'
            - '**/.next/**'
            - '**/coverage/**'
            - '**/.git/**'
            - '**/tests/**/expected.ts'
            - '**/tests/**/expected.tsx'
