# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: '1'

params:
  schema:
    run_ai_review:
      name: 'Run AI review'
      description: 'Report AppSec Remote Configuration-only options that this codemod intentionally skips'
      type: boolean
      default: false

nodes:
  - id: apply-transform
    name: Move experimental.appsec options
    type: automatic
    steps:
      - name: 'Move experimental.appsec to appsec/apmTracingEnabled'
        js-ast-grep:
          js_file: scripts/codemod.ts
          language: 'tsx'
          semantic_analysis: file
          base_path: '.'
          include:
            - '**/*.{js,jsx,ts,tsx,mjs,cjs}'
          exclude:
            - '**/node_modules/**'
            - '**/dist/**'
            - '**/build/**'
            - '**/.next/**'
            - '**/coverage/**'
            - '**/.git/**'
            - '**/tests/**/expected.ts'
            - '**/tests/**/expected.tsx'

      - name: 'AI report skipped AppSec remote configuration options'
        if: params.run_ai_review == true
        ai:
          prompt: |
            You are reviewing the target repository for the dd-trace-js 5.0 to 6.0 experimental.appsec migration.
            The deterministic AST step moves safe experimental.appsec options and standalone.enabled.
            Report only. Do not edit files, do not rewrite source, and do not add comments.

            Find remaining appsec.extendedHeadersCollection.*, experimental.appsec.extendedHeadersCollection.*, appsec.rasp.bodyCollection, and experimental.appsec.rasp.bodyCollection.
            These cannot be safely rewritten because v6 expects Datadog UI / Remote Configuration decisions.

            Produce a Markdown table with columns:
            File, Pattern, Why skipped, Recommended action.
