# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: '1'

params:
  schema:
    run_ai_review:
      name: 'Run AI review'
      description: 'Enable report-only AI review steps in nested codemods'
      type: boolean
      default: false
    run_ai_config_step:
      name: 'Run AI config step'
      description: 'Enable AI config-file steps in nested codemods'
      type: boolean
      default: false
    run_final_ai_review:
      name: 'Run final AI review'
      description: 'Run a final report-only AI review for unresolved dd-trace 5 to 6 migration blockers'
      type: boolean
      default: false

nodes:
  - id: dd-trace-js-v6-migration
    name: dd-trace 5 to 6 Migration
    type: automatic
    steps:
      - name: 'Rewrite Span.addLink positional overload'
        codemod:
          source: '@codemod/dd-trace-js-v6-add-link-object-argument'

      - name: 'Rename Datadog plugin allow/block list options'
        codemod:
          source: '@codemod/dd-trace-js-v6-rename-plugin-list-options'

      - name: 'Move experimental.iast options'
        codemod:
          source: '@codemod/dd-trace-js-v6-move-experimental-iast-options'

      - name: 'Move experimental.appsec options'
        codemod:
          source: '@codemod/dd-trace-js-v6-move-experimental-appsec-options'

      - name: 'Flatten ingestion options'
        codemod:
          source: '@codemod/dd-trace-js-v6-flatten-ingestion-options'

      - name: 'Rename profiling env vars in JS/TS source'
        codemod:
          source: '@codemod/dd-trace-js-v6-rename-profiling-env-vars'

      - name: 'Rename runtime id env var in JS/TS source'
        codemod:
          source: '@codemod/dd-trace-js-v6-rename-runtime-id-env-var'

      - name: 'Rename b3 single header propagation style in JS/TS source'
        codemod:
          source: '@codemod/dd-trace-js-v6-rename-b3-style'

      - name: 'AI report unresolved dd-trace migration blockers'
        if: params.run_final_ai_review == true
        ai:
          prompt: |
            You are reviewing a repository after the deterministic dd-trace-js 5.0 to 6.0 codemods ran.
            Report only. Do not edit files, do not rewrite source, and do not add comments.

            Find unresolved migration blockers:
            - Remaining experimental.b3 programmatic config and DD_TRACE_EXPERIMENTAL_B3_ENABLED usage. Recommend DD_TRACE_PROPAGATION_STYLE, and flag conflicts when propagationStyle or propagationStyleExtract/propagationStyleInject already exists.
            - Remaining iast.securityControlsConfiguration or experimental.iast.securityControlsConfiguration. Recommend moving the value to DD_IAST_SECURITY_CONTROLS_CONFIGURATION.
            - Remaining appsec.extendedHeadersCollection.* and appsec.rasp.bodyCollection under appsec or experimental.appsec. Recommend Datadog UI / Remote Configuration.
            - dd-trace migration env vars in .env, Dockerfile, docker-compose, YAML, shell, CI, or deployment files that deterministic JS/TS codemods intentionally do not modify.

            Produce a Markdown table with columns:
            File, Pattern, Why unresolved, Recommended action.

            Keep findings specific. If the correct target requires a product or deployment decision, state that decision instead of guessing.
