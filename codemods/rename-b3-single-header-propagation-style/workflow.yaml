# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

params:
  schema:
    run_ai_config_step:
      name: "Run AI config step"
      description: "Update b3 single header propagation values in non-JS config files"
      type: string
      default: "false"

nodes:
  - id: apply-transform
    name: Rename b3 single header propagation style
    type: automatic
    steps:
      - name: "Rename b3 single header values in JS/TS source"
        js-ast-grep:
          js_file: scripts/codemod.ts
          language: "tsx"
          base_path: "."
          include:
            - "**/*.{js,jsx,ts,tsx,mjs,cjs}"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/.next/**"
            - "**/coverage/**"
            - "**/.git/**"
            - "**/tests/**/expected.ts"
            - "**/tests/**/expected.tsx"

      - name: "AI update b3 single header values in config files"
        if: params.run_ai_config_step == "true"
        ai:
          prompt: |
            You are completing the dd-trace-js 5.0 to 6.0 propagation style value migration after the deterministic JS/TS AST step.
            You may edit non-JS configuration files only when the value belongs to DD_TRACE_PROPAGATION_STYLE or an equivalent Datadog propagation style setting.

            Replace the exact legacy value b3 single header with b3, preserving other comma-separated/list values and formatting.
            Examples:
            - DD_TRACE_PROPAGATION_STYLE=datadog,b3 single header -> DD_TRACE_PROPAGATION_STYLE=datadog,b3
            - DD_TRACE_PROPAGATION_STYLE: "b3 single header" -> DD_TRACE_PROPAGATION_STYLE: "b3"

            Allowed targets include .env files, Dockerfile ENV declarations, docker-compose/YAML environment maps, shell export/assignment lines, and CI/deployment env blocks.
            Do not change comments, docs, arbitrary prose, unrelated string literals, or generated/vendor files.
            If a file format is ambiguous, report it instead of editing it.
